name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        
    - run: corepack enable
    - run: pnpm set version 1.22.22
    - run: pnpm install --immutable --ignore-engines
    
    - name: Run Typecheck
      run: pnpm typecheck
      
    - name: Run Linter
      run: pnpm lint
      
    - name: Run Tests
      run: pnpm test:run
      
    - name: Build
      run: pnpm build
